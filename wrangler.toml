# Cloudflare Pages. Functions need a host that runs them, which GitHub Pages does not.
name = "ol-barbershop"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"

# This block is what `wrangler d1 execute ol-barbershop` resolves against. It is
# NOT how the binding reaches the running Worker, and assuming otherwise costs an
# afternoon:
#
#   Locally, `wrangler pages dev` ignores this block. Pass --d1 DB=ol-barbershop
#   or env.DB is undefined and every route touching it returns 500.
#
#   In production, a Pages project takes its D1 binding from the dashboard,
#   Settings > Bindings. Editing this file does not create it.
#
# database_id is kept equal to database_name so the local file `d1 execute` writes
# to is the same one --d1 DB=ol-barbershop gives the Worker. Different values mean
# two separate SQLite files and a schema that appears to apply to nothing.
[[d1_databases]]
binding = "DB"
database_name = "ol-barbershop"
database_id = "ol-barbershop"

# Secrets are never listed here. Set them once with `wrangler pages secret put NAME`,
# or in the Pages dashboard under Settings > Environment variables:
#   GOOGLE_CLIENT_ID       the OAuth client id for this site's origin
#   SESSION_SECRET         a long random string; rotating it signs everyone out
#   ADMIN_PULL_TOKEN       a long random string Katherine pastes into admin once
#   STRIPE_SECRET_KEY      sk_live_... (sk_test_... while testing)
#   STRIPE_WEBHOOK_SECRET  whsec_... from the webhook endpoint
#   STRIPE_PRICE_MONTHLY   the $50/month recurring price id
#   STRIPE_PRICE_SETUP     the $100 one-time price id
